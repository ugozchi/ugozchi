<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Ugo Zanchi</title>
  <desc id="desc">Data Engineer and Software Developer based in Paris. Pipelines, apps and agents.</desc>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#D0D7DE"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="1"/>
    </linearGradient>
    <mask id="fade-mask">
      <rect width="1200" height="320" fill="url(#fade)"/>
    </mask>
    <clipPath id="card">
      <rect width="1200" height="320" rx="16"/>
    </clipPath>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .flow { stroke-dasharray: 4 8; animation: flow 1.6s linear infinite; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes flow { to { stroke-dashoffset: -24; } }
    @keyframes pulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .flow, .pulse { animation: none; } }
  </style>

  <!-- Card -->
  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="#F6F8FA"/>
    <rect width="1200" height="320" fill="url(#dots)" mask="url(#fade-mask)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="15.5" fill="none" stroke="#D0D7DE"/>

  <!-- Identity -->
  <text x="72" y="77" class="mono" font-size="14" letter-spacing="3" fill="#59636E">PARIS · FRANCE</text>
  <text x="70" y="143" class="sans" font-size="60" font-weight="700" letter-spacing="-1.5" fill="#1F2328">Ugo Zanchi</text>
  <text x="72" y="189" class="sans" font-size="26" fill="#424A53">Data Engineer <tspan fill="#0F766E">·</tspan> Software Developer</text>
  <rect x="72" y="213" width="40" height="3" rx="1.5" fill="#0F766E"/>
  <text x="72" y="251" class="mono" font-size="16" fill="#59636E">pipelines <tspan fill="#0F766E">→</tspan> apps <tspan fill="#0F766E">→</tspan> agents</text>

  <!-- Data flow: sources → pipeline → outputs -->
  <g fill="none" stroke-width="1.5">
    <g stroke="#D0D7DE">
      <path d="M816 102 C848 102 848 160 880 160"/>
      <path d="M816 160 L880 160"/>
      <path d="M816 218 C848 218 848 160 880 160"/>
      <path d="M1008 160 C1034 160 1034 122 1060 122"/>
      <path d="M1008 160 C1034 160 1034 198 1060 198"/>
    </g>
    <g stroke="#0F766E" class="flow">
      <path d="M816 102 C848 102 848 160 880 160"/>
      <path d="M816 160 L880 160"/>
      <path d="M816 218 C848 218 848 160 880 160"/>
      <path d="M1008 160 C1034 160 1034 122 1060 122"/>
      <path d="M1008 160 C1034 160 1034 198 1060 198"/>
    </g>
  </g>

  <g class="mono" font-size="14" text-anchor="middle">
    <rect x="720" y="86" width="96" height="32" rx="8" fill="#FFFFFF" stroke="#D0D7DE"/>
    <text x="768" y="107" fill="#424A53">api</text>
    <rect x="720" y="144" width="96" height="32" rx="8" fill="#FFFFFF" stroke="#D0D7DE"/>
    <text x="768" y="165" fill="#424A53">sql</text>
    <rect x="720" y="202" width="96" height="32" rx="8" fill="#FFFFFF" stroke="#D0D7DE"/>
    <text x="768" y="223" fill="#424A53">events</text>

    <rect x="880" y="140" width="128" height="40" rx="10" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.5"/>
    <circle cx="898" cy="160" r="3.5" fill="#0F766E" class="pulse"/>
    <text x="950" y="165" fill="#1F2328">pipeline</text>

    <rect x="1060" y="106" width="88" height="32" rx="8" fill="#FFFFFF" stroke="#D0D7DE"/>
    <text x="1104" y="127" fill="#424A53">app</text>
    <rect x="1060" y="182" width="88" height="32" rx="8" fill="#FFFFFF" stroke="#D0D7DE"/>
    <text x="1104" y="203" fill="#424A53">agent</text>
  </g>
</svg>
